name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: No plaintext flags in the APK
        run: ./gradlew --no-daemon verifyNoPlaintextFlags

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/evilcorp-android-${GITHUB_REF_NAME}.apk"
          cd dist && sha256sum "evilcorp-android-${GITHUB_REF_NAME}.apk" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/evilcorp-android-${GITHUB_REF_NAME}.apk \
            dist/SHA256SUMS \
            --title "EvilCorp Android ${GITHUB_REF_NAME}" \
            --generate-notes
